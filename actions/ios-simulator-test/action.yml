name: iOS simulator test
description: >-
  Run `xcodebuild test` on a simulator chosen at run time, unsigned, and fail
  unless at least one test actually executed.
inputs:
  working-directory:
    description: The directory holding the project or workspace
    default: '.'
  project:
    description: Path to the .xcodeproj (this or workspace)
    default: ''
  workspace:
    description: Path to the .xcworkspace (this or project)
    default: ''
  scheme:
    description: The scheme whose test action runs
    required: true
  configuration:
    default: Debug
  prefer:
    description: Regex for the preferred simulator name, e.g. "^iPhone Duo$"; any iPhone otherwise
    default: '^iPhone'
outputs:
  udid:
    description: The simulator the tests ran on
    value: ${{ steps.test.outputs.udid }}
  tests:
    description: How many tests xcodebuild reported executing
    value: ${{ steps.test.outputs.tests }}
runs:
  using: composite
  steps:
    - id: test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PROJECT: ${{ inputs.project }}
        WORKSPACE: ${{ inputs.workspace }}
        SCHEME: ${{ inputs.scheme }}
        CONFIGURATION: ${{ inputs.configuration }}
        PREFER: ${{ inputs.prefer }}
      run: |
        set -euo pipefail
        # Chosen at run time: a hard-coded device name breaks whenever the image changes.
        pick=$(xcrun simctl list devices available --json | jq -r --arg prefer "$PREFER" '
          [ .devices | to_entries[] | select(.key | test("iOS")) | .value[] ] as $all
          | ($all | map(select(.name | test($prefer)))) + ($all | map(select(.name | startswith("iPhone"))))
          | first | if . then "\(.udid)\t\(.name)" else empty end')
        if [ -z "$pick" ]; then
          echo "::error::no iOS iPhone simulator is available on this runner"
          xcrun simctl list devices available
          exit 1
        fi
        udid=${pick%%$'\t'*}
        echo "testing on ${pick#*$'\t'} ($udid)"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        result="$RUNNER_TEMP/ios-simulator-test.xcresult"
        rm -rf "$result"
        args=(test -scheme "$SCHEME" -configuration "$CONFIGURATION" -sdk iphonesimulator -destination "id=$udid"
              -resultBundlePath "$result" CODE_SIGNING_ALLOWED=NO)
        if [ -n "$WORKSPACE" ]; then args+=(-workspace "$WORKSPACE"); elif [ -n "$PROJECT" ]; then args+=(-project "$PROJECT"); fi
        log="$RUNNER_TEMP/xcodebuild-test.log"
        # The raw log is kept for the failure message below.
        if command -v xcbeautify >/dev/null; then
          xcodebuild "${args[@]}" | tee "$log" | xcbeautify
        else
          xcodebuild "${args[@]}" | tee "$log"
        fi
        # `xcodebuild test` exits 0 on a bundle with no tests, so check something ran.
        # Counted from the result bundle: the log's "Executed N tests" is XCTest's
        # alone, and Swift Testing (Xcode's default for a new target) prints no such line.
        count=$(xcrun xcresulttool get test-results summary --path "$result" --compact \
          | jq '(.totalTestCount // 0) - (.skippedTests // 0)')
        if ! [ "$count" -gt 0 ] 2>/dev/null; then
          echo "::error::xcodebuild test reported no tests executed"
          grep -E 'Executed .* test|Test Suite|Test run' "$log" | tail -20 || true
          exit 1
        fi
        echo "tests=$count" >> "$GITHUB_OUTPUT"
        echo "$count test(s) executed"
