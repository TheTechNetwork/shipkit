name: Prepare the app
description: Install Node, pnpm and Homebrew formulae if asked, then run the caller's prepare command.
inputs:
  node-version:
    description: Empty to leave Node as it is
    default: ''
  pnpm-version:
    default: ''
  brew-packages:
    default: ''
  directory:
    default: '.'
  command:
    description: Runs with bash -euo pipefail in `directory`; empty to skip
    default: ''
runs:
  using: composite
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - if: inputs.pnpm-version != ''
      shell: bash
      env:
        PNPM: ${{ inputs.pnpm-version }}
      run: npm install -g "pnpm@$PNPM"
    - if: inputs.brew-packages != ''
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
        HOMEBREW_NO_INSTALL_CLEANUP: '1'
        PACKAGES: ${{ inputs.brew-packages }}
      run: |
        # Untap rather than silence: the image's aws/tap makes every brew command
        # print a tap-trust paragraph, and disabling the check would disable it everywhere.
        brew untap aws/tap >/dev/null 2>&1 || true
        # shellcheck disable=SC2086
        brew install $PACKAGES
    - if: inputs.command != ''
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        PREPARE_COMMAND: ${{ inputs.command }}
      run: bash -euo pipefail -c "$PREPARE_COMMAND"
