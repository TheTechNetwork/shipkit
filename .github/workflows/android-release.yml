name: Android release

# Build a signed APK and App Bundle, attach the APK to a GitHub release, and
# publish the bundle to a Play track.
#
# GRADLE ENV CONTRACT (README, "Android env contract"). The build runs with
# ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD and ANDROID_VERSION_CODE in its environment; the app's
# build.gradle reads them (Expo: @thetechnetwork/expo-shipkit-plugin does it).

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      jdk:
        type: string
        default: '25'
      jdk-distribution:
        type: string
        default: temurin
      sdk-packages:
        description: "sdkmanager packages, e.g. \"platform-tools platforms;android-37.1 build-tools;37.0.0\""
        type: string
        default: platform-tools
      node-version:
        description: Node for prepare-command and Expo (empty to skip)
        type: string
        default: '24'
      pnpm-version:
        type: string
        default: ''
      app-directory:
        description: Where prepare-command runs
        type: string
        default: '.'
      prepare-command:
        description: 'e.g. "npm ci && npx expo prebuild --platform android --clean"'
        type: string
        default: ''
      working-directory:
        description: The Gradle project (holds gradlew), e.g. "android" for Expo
        type: string
        default: '.'
      module:
        description: The application module
        type: string
        default: app
      gradle-tasks:
        type: string
        default: assembleRelease bundleRelease
      version-code:
        description: ANDROID_VERSION_CODE (empty means github.run_number, which only increases)
        type: string
        default: ''
      attach-to-release:
        description: Upload the APK to the GitHub release (the caller must grant contents write)
        type: boolean
        default: false
      release-tag:
        description: The release to attach to (empty means the triggering release's tag)
        type: string
        default: ''
      publish:
        description: Publish the bundle to Google Play
        type: boolean
        default: false
      package-name:
        description: applicationId, needed to publish
        type: string
        default: ''
      track:
        description: Play track to use always (empty chooses by event, below)
        type: string
        default: ''
      commit-track:
        description: Track for pushes, dispatches and prereleases
        type: string
        default: beta
      release-track:
        description: Track for a published, non-prerelease GitHub release
        type: string
        default: production
      rollout:
        description: Staged rollout fraction on the release track only (empty ships the whole track)
        type: string
        default: ''
      release-notes:
        description: Play release notes (empty uses the release body or commit message)
        type: string
        default: ''
      artifact-prefix:
        type: string
        default: android
      shipkit-ref:
        description: The shipkit ref whose tools this run uses; keep it equal to the ref in `uses:`
        type: string
        default: v0.1.1
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
    outputs:
      built:
        description: '"true" when a signed build was made, "false" when skipped for want of a keystore'
        value: ${{ jobs.build.outputs.built }}
      version-code:
        value: ${{ jobs.build.outputs.version-code }}
      published:
        description: '"true" when Play accepted the bundle'
        value: ${{ jobs.publish.outputs.published || 'false' }}

# No permissions block: a called workflow cannot raise them, and asking for
# contents write here would fail every caller that does not attach to a release.

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      built: ${{ steps.keystore.outputs.have }}
      version-code: ${{ steps.keystore.outputs.version-code }}
    env:
      # The Gradle launcher, not only the daemon, warns about restricted native access on JDK 25.
      GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
    steps:
      - name: Check there is a keystore to sign with
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version-code || github.run_number }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::version-code must be a positive integer up to 2100000000 (Play's limit), not '$VERSION_CODE'"
            exit 1
          fi
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          # An unsigned release build cannot be installed or published, so skip instead.
          if [ -n "$missing" ]; then
            echo "::warning::Not set:$missing — skipping the signed Android build. See the shipkit README, Secrets."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7.0.1
        if: steps.keystore.outputs.have == 'true'
      - uses: actions/checkout@v7.0.1
        if: steps.keystore.outputs.have == 'true'
        with:
          repository: TheTechNetwork/shipkit
          ref: ${{ inputs.shipkit-ref }}
          path: .shipkit
      - uses: actions/setup-java@v6.2.0
        if: steps.keystore.outputs.have == 'true'
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk }}
      - uses: android-actions/setup-android@v4.0.4
        if: steps.keystore.outputs.have == 'true'
        with:
          # Installed explicitly, so a missing platform fails here and not mid-Gradle.
          packages: ${{ inputs.sdk-packages }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        if: steps.keystore.outputs.have == 'true'

      - uses: ./.shipkit/actions/prepare
        if: steps.keystore.outputs.have == 'true'
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          directory: ${{ inputs.app-directory }}
          command: ${{ inputs.prepare-command }}

      - name: Write the keystore
        if: steps.keystore.outputs.have == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Outside the source tree, so it can never be committed by accident.
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release
        if: steps.keystore.outputs.have == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Play refuses a versionCode it has already seen.
          ANDROID_VERSION_CODE: ${{ steps.keystore.outputs.version-code }}
          TASKS: ${{ inputs.gradle-tasks }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          # shellcheck disable=SC2086
          ./gradlew --no-daemon $TASKS

      - name: Check what was built is signed
        if: steps.keystore.outputs.have == 'true'
        working-directory: ${{ inputs.working-directory }}
        env:
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$MODULE"/build/outputs/apk/release/*.apk)
          aabs=("$MODULE"/build/outputs/bundle/release/*.aab)
          echo "APKs: ${apks[*]:-none}"
          echo "bundles: ${aabs[*]:-none}"
          # A release that fell back to the debug key would install and then be refused by Play.
          tools=("${ANDROID_HOME:-/nonexistent}"/build-tools/*/apksigner)
          apksigner=""
          [ ${#tools[@]} -eq 0 ] || apksigner=${tools[${#tools[@]}-1]}
          [ -n "$apksigner" ] || echo "::notice::apksigner not found; signer not checked"
          for apk in "${apks[@]}"; do
            [ -n "$apksigner" ] || break
            signer=$("$apksigner" verify --print-certs "$apk" 2>/dev/null | grep -m1 'certificate DN' || true)
            echo "$apk: ${signer:-unverified}"
            if [[ "$signer" == *"CN=Android Debug"* ]]; then
              echo "::error::$apk is signed with the debug key; build.gradle is not reading ANDROID_KEYSTORE_FILE"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7.0.2
        if: steps.keystore.outputs.have == 'true' && contains(inputs.gradle-tasks, 'assemble')
        with:
          name: ${{ inputs.artifact-prefix }}-release-apk
          path: ${{ inputs.working-directory }}/${{ inputs.module }}/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # error, not warn: an empty bundle artifact otherwise surfaces in the next job as "Artifact not found".
      - uses: actions/upload-artifact@v7.0.2
        if: steps.keystore.outputs.have == 'true' && contains(inputs.gradle-tasks, 'bundle')
        with:
          name: ${{ inputs.artifact-prefix }}-release-bundle
          path: ${{ inputs.working-directory }}/${{ inputs.module }}/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Attach the APK to the release
        if: steps.keystore.outputs.have == 'true' && inputs.attach-to-release
        working-directory: ${{ inputs.working-directory }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
          MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::attach-to-release needs a release: run on a release event or pass release-tag"
            exit 1
          fi
          gh release upload "$TAG" "$MODULE"/build/outputs/apk/release/*.apk --clobber --repo "$GITHUB_REPOSITORY"

  # Play, on the track the event means: a merge or prerelease is testers, a full
  # release is everybody. Nothing reaches production without a published release.
  publish:
    needs: build
    if: needs.build.outputs.built == 'true' && inputs.publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.play.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: TheTechNetwork/shipkit
          ref: ${{ inputs.shipkit-ref }}
          path: .shipkit
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
      # store-ship imports its JWT signer from the worker-push workspace; this links it (no registry, no scripts).
      - name: Link shipkit's store-ship to worker-push
        run: npm ci --prefix .shipkit --workspace packages/store-ship --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-release-bundle
          path: bundle
      - name: Upload to Play
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ inputs.package-name }}
          FORCED_TRACK: ${{ inputs.track }}
          COMMIT_TRACK: ${{ inputs.commit-track }}
          RELEASE_TRACK: ${{ inputs.release-track }}
          ROLLOUT: ${{ inputs.rollout }}
          EVENT: ${{ github.event_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          NOTES: ${{ inputs.release-notes || github.event.release.body || github.event.release.name || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Play. See the shipkit README, Secrets."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PLAY_PACKAGE_NAME" ]; then
            echo "::error::publish needs the package-name input"
            exit 1
          fi
          # A prerelease says "not ready for production", so it stays on the commit track.
          PLAY_ROLLOUT=""
          if [ -n "$FORCED_TRACK" ]; then
            PLAY_TRACK="$FORCED_TRACK"
          elif [ "$EVENT" = "release" ] && [ "$PRERELEASE" != "true" ]; then
            PLAY_TRACK="$RELEASE_TRACK"
            PLAY_ROLLOUT="$ROLLOUT"
          else
            PLAY_TRACK="$COMMIT_TRACK"
          fi
          AAB_PATH=$(find bundle -name '*.aab' | head -1)
          export PLAY_TRACK PLAY_ROLLOUT AAB_PATH
          RELEASE_NOTES="$NOTES" node .shipkit/packages/store-ship/bin/store-ship.mjs play-release
          echo "published=true" >> "$GITHUB_OUTPUT"
